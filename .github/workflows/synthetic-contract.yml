name: Synthetic template contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pure synthetic validator
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_demo_contract.py' -v
      - name: Test offline synthetic demo
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_synthetic_demo.py' -v
