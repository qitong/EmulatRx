name: Synthetic template contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pure synthetic validator
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_demo_contract.py' -v
      - name: Test offline synthetic demo
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_synthetic_demo.py' -v
      - name: Test public metadata receipt with synthetic HTTP only
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_public_metadata.py' -v

  tte-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal pinned scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.0 \
            scipy==1.15.1 \
            pandas==2.2.3 \
            scikit-learn==1.5.2 \
            lifelines==0.30.0
      - name: Test TTE foundation, competing-risks estimators, pipeline, and E-values
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_tte_*.py' -v
