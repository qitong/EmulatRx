name: Synthetic preview service
on:
  pull_request:
  push:
    branches: [main]
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-preview.txt httpx==0.28.1
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p 'test_preview_service.py' -v
  arm64-image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build --platform linux/arm64 --build-arg CODE_COMMIT="$GITHUB_SHA" -f Dockerfile.preview -t emulatrx-preview:test .
      - run: test "$(docker image inspect emulatrx-preview:test --format '{{.Architecture}}')" = arm64
